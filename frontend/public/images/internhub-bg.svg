<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06090e" />
      <stop offset="50%" stop-color="#0b101d" />
      <stop offset="100%" stop-color="#05070c" />
    </linearGradient>

    <!-- Radial Lighting -->
    <radialGradient id="cyanGlow" cx="20%" cy="25%" r="45%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.14" />
      <stop offset="50%" stop-color="#0284c7" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="emeraldGlow" cx="80%" cy="75%" r="45%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.10" />
      <stop offset="60%" stop-color="#059669" stop-opacity="0.03" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="blueGlow" cx="65%" cy="20%" r="40%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.12" />
      <stop offset="70%" stop-color="#1d4ed8" stop-opacity="0.02" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Technical Grid Pattern -->
    <pattern id="techGrid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.35" />
      <circle cx="60" cy="60" r="1" fill="#38bdf8" fill-opacity="0.3" />
      <circle cx="0" cy="0" r="1" fill="#34d399" fill-opacity="0.25" />
    </pattern>

    <!-- Dot Matrix Pattern -->
    <pattern id="dotMatrix" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.75" fill="#475569" fill-opacity="0.22" />
    </pattern>
  </defs>

  <!-- Base Fill -->
  <rect width="1920" height="1080" fill="url(#bgGrad)" />

  <!-- Technical Overlay Grids -->
  <rect width="1920" height="1080" fill="url(#dotMatrix)" />
  <rect width="1920" height="1080" fill="url(#techGrid)" opacity="0.65" />

  <!-- Atmospheric Glows -->
  <rect width="1920" height="1080" fill="url(#cyanGlow)" />
  <rect width="1920" height="1080" fill="url(#blueGlow)" />
  <rect width="1920" height="1080" fill="url(#emeraldGlow)" />

  <!-- Circuit Network & Connected Nodes -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- Top Circuit Spine -->
    <path d="M 0 180 L 320 180 L 460 280 L 840 280 L 980 180 L 1400 180 L 1540 280 L 1920 280" 
          fill="none" stroke="#0284c7" stroke-width="1.2" stroke-opacity="0.35" stroke-dasharray="8 6" />

    <!-- Secondary Interconnects -->
    <path d="M 180 0 L 180 340 L 280 440 L 280 720 L 420 860 L 920 860 L 1020 960 L 1920 960" 
          fill="none" stroke="#0d9488" stroke-width="1.2" stroke-opacity="0.28" />

    <path d="M 720 0 L 720 160 L 640 240 L 640 580 L 760 700 L 1280 700 L 1380 600 L 1380 0" 
          fill="none" stroke="#3b82f6" stroke-width="1" stroke-opacity="0.25" stroke-dasharray="4 4" />

    <path d="M 1200 1080 L 1200 880 L 1320 760 L 1600 760 L 1720 640 L 1720 280" 
          fill="none" stroke="#10b981" stroke-width="1.2" stroke-opacity="0.3" stroke-dasharray="12 4" />

    <!-- High-Density Data Bus Branches -->
    <path d="M 460 280 L 460 480 L 520 540 L 900 540" fill="none" stroke="#38bdf8" stroke-width="0.8" stroke-opacity="0.3" />
    <path d="M 840 280 L 840 420 L 780 480" fill="none" stroke="#34d399" stroke-width="0.8" stroke-opacity="0.35" />
    <path d="M 1540 280 L 1540 460 L 1460 540 L 1120 540" fill="none" stroke="#60a5fa" stroke-width="0.8" stroke-opacity="0.25" />
  </g>

  <!-- Network Nodes & Relays -->
  <g>
    <!-- Node 1: Left Sector -->
    <circle cx="460" cy="280" r="5" fill="#082f49" stroke="#38bdf8" stroke-width="2" />
    <circle cx="460" cy="280" r="1.5" fill="#e0f2fe" />
    <text x="475" y="275" fill="#0ea5e9" font-family="monospace" font-size="9" letter-spacing="1">NODE://SYS-ALPHA</text>

    <!-- Node 2: Central Hub -->
    <circle cx="840" cy="280" r="6" fill="#022c22" stroke="#10b981" stroke-width="2" />
    <circle cx="840" cy="280" r="2" fill="#d1fae5" />
    <text x="855" y="275" fill="#10b981" font-family="monospace" font-size="9" letter-spacing="1">CORE://ROUTER-01</text>

    <!-- Node 3: Right Sector -->
    <circle cx="1540" cy="280" r="5" fill="#1e1b4b" stroke="#818cf8" stroke-width="2" />
    <circle cx="1540" cy="280" r="1.5" fill="#e0e7ff" />
    <text x="1555" y="275" fill="#818cf8" font-family="monospace" font-size="9" letter-spacing="1">GATEWAY://EDGE-04</text>

    <!-- Node 4: Lower Bus -->
    <circle cx="760" cy="700" r="4.5" fill="#082f49" stroke="#06b6d4" stroke-width="1.5" />
    <circle cx="1280" cy="700" r="4.5" fill="#064e3b" stroke="#34d399" stroke-width="1.5" />
    <circle cx="280" cy="440" r="4" fill="#1e293b" stroke="#94a3b8" stroke-width="1.5" />
    <circle cx="420" cy="860" r="4" fill="#0c4a6e" stroke="#38bdf8" stroke-width="1.5" />
  </g>

  <!-- Technical Frame Coordinates & Calibration Ticks -->
  <g fill="#475569" font-family="monospace" font-size="10" opacity="0.45">
    <text x="40" y="50">LOC: 37.7749° N, 122.4194° W</text>
    <text x="40" y="70">SYS_AUTH_LEVEL: RESTRICTED // TIER-1</text>
    <text x="1750" y="50" text-anchor="end">PROTO: TLS_1.3 // SHA-256</text>
    <text x="1750" y="70" text-anchor="end">SEC_DOMAIN: CAMPUS.INTERNHUB</text>
    <text x="40" y="1040">LATENCY_INDEX: OPTIMAL &lt; 15MS</text>
    <text x="1750" y="1040" text-anchor="end">FRAME_VER: 2026.09.FND</text>
  </g>

  <!-- Corner Brackets -->
  <path d="M 20 50 L 20 20 L 50 20" fill="none" stroke="#0ea5e9" stroke-width="1.5" stroke-opacity="0.4" />
  <path d="M 1900 50 L 1900 20 L 1870 20" fill="none" stroke="#0ea5e9" stroke-width="1.5" stroke-opacity="0.4" />
  <path d="M 20 1030 L 20 1060 L 50 1060" fill="none" stroke="#0ea5e9" stroke-width="1.5" stroke-opacity="0.4" />
  <path d="M 1900 1030 L 1900 1060 L 1870 1060" fill="none" stroke="#0ea5e9" stroke-width="1.5" stroke-opacity="0.4" />
</svg>
